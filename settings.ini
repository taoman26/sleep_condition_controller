[enabled]
# プログラムの実行制御
# 1: 実行する
# 0: 実行しない
run = 1

[schedule]
# 強制終了時間（24時間制）
# エアコンが稼動中の場合、この時間になったら強制的に停止する
force_stop_hour = 9

[discomfort_index]
# 不快指数（DI = 0.81T + 0.01H(0.99T-14.3) + 46.3）による制御
# on_threshold以上でエアコンを起動し、off_threshold以下になったら停止します
# ON/OFFを同じ値にすると次のチェックで即座に再起動してしまうため、
# off_thresholdはon_thresholdより3〜5ポイント低い値を目安に設定してください
on_threshold = 80.0
off_threshold = 75.0

[safety]
# 安全装置（秒）
# 不快指数がoff_thresholdまで下がらなくても、この時間を超えたら強制的に停止します
max_runtime = 1800
